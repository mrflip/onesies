[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clockwords"
version = "0.1.0"
description = "Word-clock phrase generator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "scipy>=1.12",
    "optuna>=3.6",
]
dev = [
    "poethepoet>=0.29",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.poe.tasks]
test      = "pytest"
lint      = ["_lint_ruff", "_lint_mypy"]
fmt       = "ruff format src tests"
dump-menu = "python scripts/dump_time_menu.py"

[tool.poe.tasks._lint_ruff]
cmd = "ruff check src tests"

[tool.poe.tasks._lint_mypy]
cmd = "mypy"

[tool.hatch.build.targets.wheel]
packages = ["src/clockwords"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]
